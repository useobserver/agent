{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "observer-agent.fullname" . }}
  labels:
    {{- include "observer-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "observer-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Nothing reaches the agent except the relay and OTLP ports, when enabled.
  ingress:
    {{- if or .Values.heartbeatRelay.enabled .Values.otlp.enabled }}
    - ports:
        {{- if .Values.heartbeatRelay.enabled }}
        - port: {{ .Values.heartbeatRelay.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.otlp.enabled }}
        - port: {{ .Values.otlp.port }}
          protocol: TCP
        {{- end }}
    {{- else }} []
    {{- end }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Observer and HTTPS checks
    - ports:
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
