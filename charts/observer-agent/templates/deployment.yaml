{{- $fullname := include "observer-agent.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "observer-agent.labels" . | nindent 4 }}
spec:
  # One agent key = one running agent: the local queue is a single-writer
  # SQLite file on a ReadWriteOnce volume, and Observer fences duplicate keys.
  # Not configurable; Recreate stops the old pod before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "observer-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observer-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.agentKey .Values.podAnnotations }}
      annotations:
        {{- if .Values.agentKey }}
        # Restarts the pod when the chart-created key Secret changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "observer-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: observer-agent
          image: {{ include "observer-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Only variables from the agent runtime contract (AGENT_RUNTIME.env in
          # packages/protocol agent-runtime.ts), plus extraEnv / envFrom.
          env:
            - name: AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "observer-agent.keySecretName" . }}
                  key: {{ include "observer-agent.keySecretKey" . }}
            - name: CLOUD_SERVER_URL
              value: {{ .Values.cloudUrl | quote }}
            - name: BUFFER_PATH
              value: /data/observer-agent-buffer.db
            # The probes call /healthz; the dashboard stays on loopback.
            - name: ENABLE_DEBUG_DASHBOARD
              value: "true"
            # No on-disk transpiler cache: the root filesystem is read-only.
            - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
              value: "0"
            - name: LOG_BROADCAST_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: VERBOSE
              value: {{ .Values.verbose | toString | quote }}
            - name: BROADCAST_LOGS
              value: {{ .Values.broadcastLogs | toString | quote }}
            {{- with .Values.prometheus }}
            {{- if .url }}
            - name: PROMETHEUS_SERVER_URL
              value: {{ .url | quote }}
            - name: PROMETHEUS_BASIC_AUTH_ENABLED
              value: {{ .basicAuth.enabled | toString | quote }}
            {{- if .basicAuth.enabled }}
            - name: PROMETHEUS_USERNAME
              value: {{ .basicAuth.username | quote }}
            {{- if .basicAuth.passwordSecret.name }}
            - name: PROMETHEUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .basicAuth.passwordSecret.name }}
                  key: {{ .basicAuth.passwordSecret.key }}
            {{- end }}
            {{- end }}
            {{- if .bearerTokenSecret.name }}
            - name: PROMETHEUS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .bearerTokenSecret.name }}
                  key: {{ .bearerTokenSecret.key }}
            {{- end }}
            {{- if .tenantId }}
            - name: PROMETHEUS_TENANT_ID
              value: {{ .tenantId | quote }}
            {{- end }}
            {{- if .headersSecret.name }}
            - name: PROMETHEUS_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .headersSecret.name }}
                  key: {{ .headersSecret.key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.bufferMaxRows }}
            - name: BUFFER_MAX_ROWS
              value: {{ .Values.bufferMaxRows | toString | quote }}
            {{- end }}
            {{- if .Values.caBundle.configMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "/etc/observer-agent/ca/%s" .Values.caBundle.key | quote }}
            {{- end }}
            {{- with .Values.proxy }}
            {{- if .https }}
            - name: HTTPS_PROXY
              value: {{ .https | quote }}
            {{- end }}
            {{- if .http }}
            - name: HTTP_PROXY
              value: {{ .http | quote }}
            {{- end }}
            {{- if .noProxy }}
            - name: NO_PROXY
              value: {{ .noProxy | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.heartbeatRelay.enabled }}
            - name: HEARTBEAT_RELAY_ENABLED
              value: "true"
            - name: HEARTBEAT_RELAY_HOST
              value: 0.0.0.0
            - name: HEARTBEAT_RELAY_PORT
              value: {{ .Values.heartbeatRelay.port | toString | quote }}
            {{- end }}
            {{- if .Values.otlp.enabled }}
            - name: OBSERVER_OTLP_LISTEN_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.otlp.port | quote }}
            - name: OBSERVER_OTLP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlp.tokenSecret.name }}
                  key: {{ .Values.otlp.tokenSecret.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.heartbeatRelay.enabled .Values.otlp.enabled }}
          ports:
            {{- if .Values.heartbeatRelay.enabled }}
            - name: heartbeat-relay
              containerPort: {{ .Values.heartbeatRelay.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.otlp.enabled }}
            - name: otlp-http
              containerPort: {{ .Values.otlp.port }}
              protocol: TCP
            {{- end }}
          {{- end }}
          livenessProbe:
            exec:
              command: {{ include "observer-agent.healthExec" . }}
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            exec:
              command: {{ include "observer-agent.healthExec" . }}
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.caBundle.configMap }}
            - name: ca-bundle
              mountPath: /etc/observer-agent/ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if not .Values.persistence.enabled }}
          # Ephemeral: queued results are lost when the pod restarts.
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ default $fullname .Values.persistence.existingClaim }}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.caBundle.configMap }}
        - name: ca-bundle
          configMap:
            name: {{ .Values.caBundle.configMap }}
            items:
              - key: {{ .Values.caBundle.key }}
                path: {{ .Values.caBundle.key }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
