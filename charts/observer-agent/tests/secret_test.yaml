suite: secret
templates:
  - templates/secret.yaml
release:
  name: observer-agent
tests:
  - it: renders the key Secret with agentKey
    set:
      agentKey: obs_live_unittest
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: observer-agent
      - equal:
          path: data.AGENT_KEY
          decodeBase64: true
          value: obs_live_unittest

  - it: renders nothing with existingSecret
    set:
      existingSecret.name: my-key
    asserts:
      - hasDocuments:
          count: 0
