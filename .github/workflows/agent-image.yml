name: Build + push agent image to GHCR

# Public mirror image build. Source comes from the monorepo's
# tools/mirror-agent/mirror.sh — never edit this file in the public
# repo directly. Update tools/mirror-agent/templates/agent-image.yml
# in the monorepo and re-run mirror.sh push.
#
# Triggers:
#   - push to main (from the mirror)
#   - tags matching agent-v* (mirror forwards the version tag)
#   - manual workflow_dispatch
#
# Image: ghcr.io/<owner>/agent — owner is the public repo owner
# (useobserver). Tags emitted:
#   - main push:      main, sha-<short>
#   - agent-v* tag:   <x.y.z>, <x.y>, <x>, latest, sha-<short>
# `latest` moves ONLY on release tags, never on a default-branch push, so
# an unreleased main commit can never reach consumers of `:latest`.

on:
  push:
    branches: [main]
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to GHCR (false = build only)"
        required: false
        default: "true"

permissions:
  # contents:write — the tag-push path publishes a GitHub Release carrying
  # build-info.json (the per-release source-hash manifest the cloud compares
  # heartbeats against).
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Public package name — single segment under the org so consumers
  # pull `ghcr.io/useobserver/agent:<tag>`.
  IMAGE_NAME: agent

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Compute image owner
        id: owner
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"

      # Build provenance stamp (agent 1.5.0+). Runs the agent's OWN hash
      # implementation (src/build-info.ts computeSourceHash) so the baked
      # value can never drift from what a source run computes at boot.
      # `import type` lines are erased by Bun, so no install is needed.
      - name: Stamp build provenance
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Write build-info.json
        run: |
          bun -e '
            const { computeSourceHash } = await import("./src/build-info.ts");
            const pkg = JSON.parse(await Bun.file("package.json").text());
            const info = {
              channel: "official",
              version: pkg.version,
              commit: process.env.GITHUB_SHA ?? null,
              source_hash: computeSourceHash("./src"),
            };
            await Bun.write("build-info.json", JSON.stringify(info, null, 2) + "\n");
            console.log(JSON.stringify(info));
          '

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve push flag
        id: push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.push.outputs.value == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}
          # Disable the action's implicit `latest` (it would otherwise add
          # one on default-branch pushes); `latest` is set explicitly below
          # for agent-v* tags only.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=match,pattern=agent-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=agent-v(\d+\.\d+),group=1
            type=match,pattern=agent-v(\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/agent-v') }}
          labels: |
            org.opencontainers.image.title=Observer Agent
            org.opencontainers.image.description=Probes metric sources, pushes results to Observer Cloud.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.value == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
          provenance: false
          sbom: false

      # Per-release hash manifest: the cloud's daily agent-release tick
      # downloads this asset and marks heartbeats whose official hash does
      # not match the published one for their version as "modified".
      - name: Publish release manifest (tag builds)
        if: startsWith(github.ref, 'refs/tags/agent-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "Observer agent $TAG" --verify-tag
          gh release upload "$TAG" build-info.json --clobber

      - name: Summarise image
        run: |
          {
            echo "### Observer agent image"
            echo
            echo "Repository: \`${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}\`"
            echo
            echo "Pushed: \`${{ steps.push.outputs.value }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
