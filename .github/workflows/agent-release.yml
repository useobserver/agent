name: Build agent binaries + GitHub release

# Public mirror binary build. Source comes from the monorepo's
# tools/mirror-agent/mirror.sh — never edit this file in the public
# repo directly. Update
# tools/mirror-agent/templates/agent-release.yml in the monorepo and
# copy by hand. SSH deploy keys cannot push workflow files, so this
# file lives in the public repo as a one-time manual install.
#
# Runs in the PUBLIC repo (useobserver/agent) on agent-v* tags
# forwarded by mirror.sh. Produces five Bun-compiled binaries and
# attaches them to a public GitHub Release.
#
# Local build (private monorepo):
#   bun run --cwd apps/agent build:binaries
#
# Local build (public mirror):
#   bun run build:binaries

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build from"
        required: false
        default: "main"

permissions:
  contents: write   # required to create a Release + upload assets

jobs:
  build:
    name: Build agent binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Resolve agent version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/agent-v* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/agent-v}
            echo "tag=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::warning::Tag agent-v$TAG_VERSION does not match package.json version $VERSION"
            fi
          else
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all targets
        run: bun run build:binaries

      - name: Generate checksums
        working-directory: dist
        run: |
          shasum -a 256 observer-agent-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts (workflow_dispatch retention)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: observer-agent-binaries-${{ steps.version.outputs.tag }}
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Observer agent ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/observer-agent-linux-x64
            dist/observer-agent-linux-arm64
            dist/observer-agent-darwin-x64
            dist/observer-agent-darwin-arm64
            dist/observer-agent-windows-x64.exe
            dist/SHA256SUMS
          body: |
            Standalone Bun-compiled agent binaries. No runtime install
            required on the target host. Each binary embeds the Bun
            runtime + every dependency.

            ## Download

            | Platform        | File                                  |
            |-----------------|---------------------------------------|
            | Linux x64       | `observer-agent-linux-x64`            |
            | Linux arm64     | `observer-agent-linux-arm64`          |
            | macOS x64       | `observer-agent-darwin-x64`           |
            | macOS arm64     | `observer-agent-darwin-arm64`         |
            | Windows x64     | `observer-agent-windows-x64.exe`      |

            Verify with `sha256sum -c SHA256SUMS`.

            ## Usage

            ```sh
            chmod +x observer-agent-linux-x64
            AGENT_KEY=obs_live_... \
            PROMETHEUS_SERVER_URL=https://prom.local \
            CLOUD_SERVER_URL=https://use.observer \
            ./observer-agent-linux-x64
            ```

            Runtime args can be forwarded to the embedded Bun runtime
            via `BUN_OPTIONS`:
            <https://bun.com/docs/bundler/executables#runtime-arguments-via-bun_options>
